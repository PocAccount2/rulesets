name: main workflow

on:
  pull_request

permissions:
  contents: read
  packages: read

jobs:
  code_quality:
    runs-on: ubuntu-latest

    permissions:
      statuses: write  # only grant at job level if needed

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Super-linter
        uses: super-linter/super-linter@<commit-sha>  # pinned SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
